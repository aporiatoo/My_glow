/* ---- guide sheet ---- */
#gdb{position:fixed;inset:0;z-index:300;display:none}
#gdb.op{display:block}
.gdx{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(3px)}
.gds{position:absolute;left:0;right:0;bottom:0;max-height:88vh;display:flex;flex-direction:column;
 background:rgba(18,18,20,.97);backdrop-filter:blur(30px) saturate(150%);
 border-top:1px solid var(--br2);border-radius:20px 20px 0 0;animation:gup .22s ease}
@keyframes gup{from{transform:translateY(22px);opacity:.4}to{transform:translateY(0);opacity:1}}
.gdh{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--br)}
.gdt{flex:1;font-weight:700;font-size:var(--t3)}
.gdcl{width:28px;height:28px;border:1px solid var(--br2);border-radius:9px;display:grid;place-items:center;
 cursor:pointer;color:var(--dim);font-size:var(--t2)}
.gdc{overflow-y:auto;padding:14px 16px 26px}
.gdi{width:100%;border-radius:13px;border:1px solid var(--br);display:block;background:#000}
.gdph{border:1px dashed var(--br2);border-radius:13px;padding:26px 12px;text-align:center;
 color:var(--dim2);font-size:var(--t5);line-height:1.9}
.gdph div{font-size:var(--t2);margin-top:4px}

/* ---- عدد و واحد: واحد نباید هم‌وزن عدد باشد ---- */
.u{font-size:.62em;color:var(--dim);font-variation-settings:"wght" var(--w-med);
   margin-inline-start:2px;letter-spacing:0}
.skn{font-size:var(--t5);font-variation-settings:"wght" var(--w-hvy);line-height:1.15;
     font-variant-numeric:tabular-nums}
.skl{font-size:var(--t1);color:var(--dim2);margin-top:var(--sp1)}

/* ---- وضعیت با شکل، نه رنگ ---- */
.mk{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;
    border:1.5px solid var(--dim2);font-size:var(--t1);transition:all var(--d-fast) var(--e-spring)}
.mk.on{background:var(--ink);border-color:var(--ink);color:#000;transform:scale(1.04)}
.mk.half{border-color:var(--ink);
  background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}

/* ============================================================
   INTERACTION — کشیدن، نگه داشتن، ورودی سریع
   ============================================================ */

/* ---- کشیدن روی ردیف ---- */
.sw{position:relative;overflow:hidden;touch-action:pan-y}
.sw .swi{position:absolute;inset:0;display:flex;align-items:center;
  padding:0 var(--sp4);font-size:var(--t2);pointer-events:none;opacity:0;
  transition:opacity var(--d-fast) linear}
.sw .swi.r{justify-content:flex-start;color:var(--ink)}
.sw .swi.l{justify-content:flex-end;color:var(--dim)}
.sw.act .swi{opacity:1}
.sw .swc{position:relative;background:inherit;
  transition:transform var(--d-mid) var(--e-out)}
.sw.drag .swc{transition:none}

/* ---- ورودی سریع شناور ---- */
#qb{position:fixed;z-index:7;inset-inline-end:16px;bottom:88px;
  width:52px;height:52px;border-radius:50%;border:1px solid var(--br2);
  background:rgba(255,255,255,.14);backdrop-filter:blur(30px) saturate(160%);
  -webkit-backdrop-filter:blur(30px) saturate(160%);
  color:var(--ink);font-size:var(--t4);cursor:pointer;
  box-shadow:0 8px 28px rgba(0,0,0,.6);
  display:grid;place-items:center;
  transition:transform var(--d-mid) var(--e-spring),opacity var(--d-fast) linear;
  animation:qbIn var(--d-slow) var(--e-spring) both}
@keyframes qbIn{from{opacity:0;transform:scale(.4) translateY(14px)}to{opacity:1;transform:none}}
#qb:active{transform:scale(.88) rotate(45deg)}
#qb.hide{opacity:0;pointer-events:none;transform:scale(.6)}

/* برگهٔ ورودی سریع */
#qs{position:fixed;inset:0;z-index:300;display:none}
#qs.op{display:block}
#qs .qx{position:absolute;inset:0;background:rgba(0,0,0,.72);
  backdrop-filter:blur(3px);animation:fadeIn var(--d-fast) ease both}
#qs .qp{position:absolute;left:0;right:0;bottom:0;
  background:rgba(18,18,20,.97);backdrop-filter:blur(30px) saturate(150%);
  border-top:1px solid var(--br2);border-radius:22px 22px 0 0;
  padding:var(--sp3) var(--sp4) var(--sp5);
  animation:askUp var(--d-mid) var(--e-out) both}
.qgrab{width:34px;height:4px;border-radius:99px;background:var(--br2);
  margin:0 auto var(--sp4)}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp2)}
.qi{border:1px solid var(--br);border-radius:15px;background:rgba(255,255,255,.05);
  padding:var(--sp3) var(--sp1);display:flex;flex-direction:column;align-items:center;
  gap:var(--sp1);cursor:pointer;color:var(--ink);font:inherit;
  transition:transform var(--d-fast) var(--e-spring),background var(--d-fast) linear}
.qi:active{transform:scale(.93);background:rgba(255,255,255,.12)}
.qi .qic{font-size:var(--t4);line-height:1}
.qi .qil{font-size:var(--t1);color:var(--dim)}

/* ---- نوار برگرداندن ---- */
#undo{position:fixed;z-index:120;bottom:92px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(22,22,24,.97);backdrop-filter:blur(24px);
  border:1px solid var(--br2);border-radius:14px;
  padding:10px var(--sp3);display:flex;align-items:center;gap:var(--sp3);
  font-size:var(--t2);opacity:0;pointer-events:none;
  transition:opacity var(--d-mid) linear,transform var(--d-mid) var(--e-spring);
  box-shadow:0 10px 30px rgba(0,0,0,.6);max-width:92vw}
#undo.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#undo b{color:var(--ink);cursor:pointer;font-variation-settings:"wght" var(--w-bld);
  white-space:nowrap}

/* ---- کارت «الان» ---- */
.nowc{background:rgba(255,255,255,.115) !important;border-color:var(--br2) !important;
  order:-10}
/* ویو به flex تبدیل می‌شود تا order کار کند — «الان» همیشه اول */
#vw>.c,#vw>div{order:0}
#vw{display:flex;flex-direction:column}
#vw>.sub,#vw>.dir,#vw>.ix{order:-20}
.nowbig{font-size:var(--t4);font-variation-settings:"wght" var(--w-bld);
  line-height:1.5;margin:var(--sp1) 0 var(--sp2)}

/* ---- منوی نگه‌داشتن ---- */
.lp{animation:lpIn var(--d-fast) var(--e-spring) both}
@keyframes lpIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}

/* ---- حالت فشرده: همان محتوا، فاصلهٔ کمتر ---- */
body.compact{--sp3:8px;--sp4:11px;--sp5:16px}
body.compact .c{padding:11px;margin-bottom:9px}
body.compact .rw{padding:7px 9px;margin-bottom:4px}
body.compact .cs{margin:2px 0 8px}

/* ============================================================
   MOTION — انیمیشن‌ها
   همه با transform/opacity تا روی GPU اجرا شوند و reflow نسازند.
   ============================================================ */

/* ---- ورود پلکانی کارت‌ها: هر کارت کمی دیرتر ---- */
.c:nth-child(1){animation-delay:0ms}
.c:nth-child(2){animation-delay:40ms}
.c:nth-child(3){animation-delay:80ms}
.c:nth-child(4){animation-delay:120ms}
.c:nth-child(5){animation-delay:160ms}
.c:nth-child(n+6){animation-delay:200ms}

/* ---- ردیف‌ها ---- */
.rw{animation:rowIn var(--d-fast) var(--e-out) both}
@keyframes rowIn{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:none}}
.rw:active{transform:scale(.97)}

/* تیک خوردن: پالس کوتاه به‌جای تغییر رنگ خشک */
.rw.done{animation:doneP var(--d-mid) var(--e-spring)}
@keyframes doneP{
  0%{transform:scale(1)}
  45%{transform:scale(1.03);background:rgba(255,255,255,.14)}
  100%{transform:scale(1)}
}

/* ---- دکمه ---- */
.bt{transition:transform var(--d-fast) var(--e-spring),
    background var(--d-fast) linear, opacity var(--d-fast) linear}
.bt:active{transform:scale(.955)}

/* موج لمسی */
.bt{position:relative;overflow:hidden}
.bt::after{content:'';position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(circle at center,rgba(255,255,255,.34) 0%,transparent 62%);
  opacity:0;transform:scale(.35);pointer-events:none}
.bt:active::after{animation:ripple 460ms var(--e-out)}
@keyframes ripple{0%{opacity:.85;transform:scale(.35)}100%{opacity:0;transform:scale(2.4)}}

/* ---- نوار پیشرفت: scaleX روی GPU به‌جای width ---- */
.bar{height:4px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bf{height:100%;background:#fff;transform-origin:right center;
    transition:width var(--d-slow) var(--e-out)}
.bar.lg{height:7px}

/* درخشش ملایم روی نوار وقتی پر می‌شود */
.bf::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  animation:sheen 2.4s ease-in-out infinite}
.bar{position:relative}
.bf{position:relative;overflow:hidden}
@keyframes sheen{0%{transform:translateX(-100%)}60%,100%{transform:translateX(220%)}}

/* ---- اعداد: شمارش بصری ---- */
.skn,.sv{transition:transform var(--d-mid) var(--e-spring)}
.skn.bump,.sv.bump{animation:numBump var(--d-mid) var(--e-spring)}
@keyframes numBump{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}

/* ---- تعویض ویو ---- */
#vw{animation:viewIn var(--d-mid) var(--e-out)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- ناوبری ---- */
nav .nb{transition:transform var(--d-fast) var(--e-spring),
        color var(--d-fast) linear, opacity var(--d-fast) linear}
nav .nb:active{transform:scale(.9)}
nav .nb.on{animation:navPop var(--d-mid) var(--e-spring)}
@keyframes navPop{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}

/* ---- شیت راهنما ---- */
@keyframes gup{from{transform:translateY(26px);opacity:.3}to{transform:translateY(0);opacity:1}}
.gdx{animation:fadeIn var(--d-mid) ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---- دیالوگ ask ---- */
.askbd{animation:fadeIn var(--d-fast) ease both}
.askc{animation:askUp var(--d-mid) var(--e-out) both}
@keyframes askUp{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}

/* ---- توست ---- */
.tst{transition:transform var(--d-mid) var(--e-spring),opacity var(--d-mid) linear}

/* ---- اسکلت لودینگ ---- */
.skel{background:linear-gradient(90deg,
  rgba(255,255,255,.05) 25%,rgba(255,255,255,.11) 50%,rgba(255,255,255,.05) 75%);
  background-size:200% 100%;animation:shim 1.3s linear infinite;border-radius:10px}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}

/* ---- حلقهٔ پیشرفت دایره‌ای ---- */
.ring circle{transition:stroke-dashoffset var(--d-slow) var(--e-out)}

/* ---- بلوک فعال در تایم‌لاین: نبض آرام ---- */
.sl.live .si{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.22)}
  50%{box-shadow:0 0 0 7px rgba(255,255,255,0)}
}

/* ---- شمارش معکوس تنفس ---- */
.brnum{animation:breathe 1s var(--e-out)}
@keyframes breathe{0%{transform:scale(.88);opacity:.55}100%{transform:scale(1);opacity:1}}

/* ---- خالی‌بودن ---- */
.empty{text-align:center;padding:var(--sp5) var(--sp4);color:var(--dim2);
  animation:fadeIn var(--d-slow) ease both}
.empty .ei{font-size:var(--t5);opacity:.4;margin-bottom:var(--sp2);display:block}

/* ---- section index + focused page ---- */
.idx{display:flex;flex-direction:column;gap:6px}
.ix{display:flex;align-items:center;gap:11px;width:100%;text-align:start;cursor:pointer;
 background:rgba(255,255,255,.055);border:.5px solid var(--br);border-radius:16px;
 padding:13px 14px;color:var(--ink);font-family:inherit;
 backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);
 transition:background .15s,transform .1s}
.ix:active{background:rgba(255,255,255,.14);transform:scale(.985)}
.ixi{font-size:var(--t4);width:26px;text-align:center;flex-shrink:0;opacity:.9}

 display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.ixb{font-size:var(--t1);font-weight:700;color:var(--ink);background:rgba(255,255,255,.1);
 border:.5px solid var(--br);border-radius:8px;padding:3px 7px;flex-shrink:0;
 font-variant-numeric:tabular-nums;white-space:nowrap}
.ixc{font-size:var(--t3);color:var(--dim2);flex-shrink:0}
html[dir=rtl] .ixc{transform:scaleX(-1)}
.pgh{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.pgb{width:34px;height:34px;flex-shrink:0;border-radius:12px;cursor:pointer;font-size:var(--t4);line-height:1;
 background:rgba(255,255,255,.07);border:.5px solid var(--br);color:var(--ink);font-family:inherit}
.pgb:active{background:rgba(255,255,255,.18)}
html[dir=rtl] .pgb{transform:scaleX(-1)}
.pgt{display:flex;align-items:center;gap:9px;min-width:0}
.pgi{font-size:var(--t4);opacity:.9}
.pgn{font-size:var(--t3);font-weight:700;letter-spacing:0}
.pgs{font-size:var(--t1);color:var(--dim);margin-top:1px}
.pgnav{display:flex;gap:6px;margin-top:4px}
.pgnav .bt{margin:0;flex:1;font-size:var(--t1);padding:11px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---- skill tree ---- */
.tpts{display:inline-flex;align-items:baseline;gap:6px;margin:2px 0 4px;padding:5px 13px;border-radius:99px;
 background:rgba(255,255,255,.1);border:.5px solid var(--br)}
.tpn{font-size:var(--t4);font-weight:800;font-variant-numeric:tabular-nums}
.tpl{font-size:var(--t1);color:var(--dim)}
.tbr{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.tbb{background:rgba(255,255,255,.05);border:.5px solid var(--br);border-radius:13px;padding:9px 3px;
 color:var(--dim);font-family:inherit;cursor:pointer;transition:background .15s}
.tbb:active{background:rgba(255,255,255,.16)}
.tbb.on{background:#fff;color:#000;border-color:#fff}
.tbi{font-size:var(--t3);line-height:1.1}
.tbn{font-size:var(--t1);font-weight:600;margin-top:3px}
.tbp{font-size:var(--t1);opacity:.65;font-variant-numeric:tabular-nums;margin-top:1px}
.tlg{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:6px;font-size:var(--t1);color:var(--dim)}
.tlg span{display:flex;align-items:center;gap:4px}
.tdo{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.tdo.u{background:#fff}

/* ---- ask info table ---- */
.askinf{display:flex;flex-direction:column;gap:1px;border-radius:12px;overflow:hidden;border:.5px solid var(--br)}

.solg{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:7px 0 3px;font-size:var(--t1);color:var(--dim)}

.sogrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sob{background:rgba(255,255,255,.055);border:.5px solid var(--br);border-radius:12px;padding:9px 4px;text-align:center}
.sobn{font-size:var(--t4);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.sobl{font-size:var(--t1);color:var(--dim2);margin-top:2px}
.somv{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:6px;border-radius:14px;cursor:pointer;
 background:rgba(255,255,255,.05);border:.5px solid var(--br);transition:background .15s}
.somv:active{background:rgba(255,255,255,.14)}
.somv.s3{border-color:rgba(255,255,255,.34);background:rgba(255,255,255,.1)}

 background:rgba(255,255,255,.14);border:.5px solid var(--br);font-size:var(--t2);font-weight:700}
.sowb{height:3px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:5px;overflow:hidden}
.sowf{height:100%;background:#fff;border-radius:2px}
/* ---- quick tiles ---- */
.qg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.qt{background:rgba(255,255,255,.06);border:.5px solid var(--br);border-radius:15px;padding:11px 5px 9px;
 color:var(--ink);font-family:inherit;cursor:pointer;text-align:center;overflow:hidden;
 -webkit-tap-highlight-color:transparent;transition:background .15s,transform .1s}
.qt:active{background:rgba(255,255,255,.17);transform:scale(.95)}
.qt.ov{border-color:rgba(255,255,255,.34)}
.qi{font-size:var(--t4);line-height:1.1;margin-bottom:5px}
.qn{font-size:var(--t1);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qh{font-size:var(--t1);color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
/* ---- focus bar ---- */
#fzbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:40;display:none;
 background:rgba(18,18,20,.88);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);
 border-top:.5px solid rgba(255,255,255,.14);padding:0 0 7px}
#fzbar.on{display:block;animation:su .3s cubic-bezier(.2,.9,.25,1)}
.fzp{height:2px;background:rgba(255,255,255,.1)}

.fzm{flex:1;min-width:0}
.fzt{font-size:var(--t4);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:0;line-height:1.15}
.fzs{font-size:var(--t1);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fzb{background:rgba(255,255,255,.08);border:.5px solid var(--br);color:var(--dim);border-radius:9px;
 padding:7px 9px;font-size:var(--t1);font-family:inherit;cursor:pointer;flex-shrink:0}
.fzb b{color:var(--ink);font-size:var(--t1)}

/* ---- ask dialog ---- */
#askw{position:fixed;inset:0;z-index:90;display:none;align-items:flex-end;justify-content:center}
#askw.on{display:flex}
.askbd{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);animation:fi .2s ease}
.askc{position:relative;width:100%;max-width:440px;margin:0 8px 8px;max-height:86vh;display:flex;flex-direction:column;
 border-radius:24px 24px 20px 20px;background:rgba(22,22,24,.82);backdrop-filter:blur(34px) saturate(170%);
 -webkit-backdrop-filter:blur(34px) saturate(170%);border:.5px solid rgba(255,255,255,.15);
 box-shadow:0 -8px 50px rgba(0,0,0,.7);animation:su .26s cubic-bezier(.2,.9,.25,1);overflow:hidden}
@keyframes su{from{transform:translateY(26px);opacity:.3}to{transform:translateY(0);opacity:1}}
@keyframes fi{from{opacity:0}to{opacity:1}}
.askh{display:flex;align-items:flex-start;gap:9px;padding:15px 15px 9px}
.askt{font-size:var(--t3);font-weight:700;letter-spacing:0}
.asks{font-size:var(--t1);color:var(--dim);margin-top:3px;line-height:1.65}
.askcl{background:rgba(255,255,255,.07);border:.5px solid var(--br);color:var(--dim);width:26px;height:26px;
 border-radius:9px;font-size:var(--t2);cursor:pointer;flex-shrink:0;font-family:inherit}
.askb{padding:0 15px;overflow-y:auto;flex:1}
.askfd{margin-bottom:13px}
.askl{font-size:var(--t1);color:var(--dim);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.askl span{color:var(--dim2);font-size:var(--t1)}
.aski{width:100%;background:rgba(255,255,255,.06);border:.5px solid var(--br);color:var(--ink);
 border-radius:12px;padding:11px 12px;font-size:var(--t2);font-family:inherit;outline:none;-webkit-appearance:none}

.aski::-webkit-outer-spin-button,.aski::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.asknum{display:flex;align-items:center;gap:7px}
.askst{width:40px;height:42px;flex-shrink:0;background:rgba(255,255,255,.08);border:.5px solid var(--br);
 color:var(--ink);border-radius:12px;font-size:var(--t4);cursor:pointer;font-family:inherit}

<script>/* ============================================================
   SCHEMA — اعتبارسنجی و مهاجرت داده
   جایگزین repair() دستی: یک توصیف اعلانی که خودش کار می‌کند.
   ============================================================ */

/** نسخهٔ فعلی ساختار داده. با هر تغییر ناسازگار یکی بالا می‌رود. */
const SCHEMA_VERSION = 3;

/* انواع مجاز و پیش‌فرضشان.
   هر کلید: [نوع, پیش‌فرض, اعتبارسنج اختیاری] */
const SCHEMA = {
  // --- هسته ---
  v:        ['num',  SCHEMA_VERSION],
  xp:       ['num',  0,    v => v >= 0],
  done:     ['obj',  {}],
  q:        ['obj',  {}],
  logs:     ['arr',  []],
  notif:    ['bool', 1],

  // --- استریک ---
  streak:   ['shape', { clean: 0, train: 0, sleep: 0, screen: 0 }],
  best:     ['shape', { clean: 0, train: 0, sleep: 0, screen: 0 }],
  comeback: ['any',  null],

  // --- حالت‌ها ---
  mode:     ['any',  null],
  ramadan:  ['any',  null],
  season:   ['str',  'summer'],
  lang:     ['str',  'fa'],

  // --- آنبوردینگ و فصل ---
  startDate:['any',  null],
  obOff:    ['bool', 0],

  // --- بدن ---
  wt:       ['arr',  [65], a => a.filter(x => typeof x === 'number' && x > 0 && x < 300)],
  hts:      ['arr',  [],   a => a.filter(x => x && x.d && typeof x.v === 'number' && x.v > 80 && x.v < 250)],
  wo:       ['arr',  []],
  ft:       ['arr',  []],
  ms:       ['arr',  []],
  fit:      ['arr',  []],
  ftest:    ['arr',  [],   a => a.filter(x => x && x.k && typeof x.v === 'number')],
  sleepLog: ['obj',  {}],
  lifts:    ['obj',  {}],
  gymMode:  ['bool', 0],

  // --- ذهن و درس ---
  jr:       ['arr',  []],
  srs:      ['arr',  []],
  mistakes: ['arr',  []],
  grades:   ['obj',  {}],
  stLog:    ['obj',  {}],
  hw:       ['arr',  []],
  stSess:   ['arr',  []],
  exams:    ['arr',  []],
  stream:   ['any',  null],
  focus:    ['obj',  {}],

  // --- انضباط ---
  urges:    ['arr',  [],   a => a.filter(x => x && typeof x.h === 'number')],
  skips:    ['arr',  []],
  contract: ['any',  null],
  crisis:   ['num',  0],

  // --- روابط ---
  ppl:      ['arr',  [],   a => a.filter(x => x && x.n)],
  inter:    ['arr',  [],   a => a.filter(x => x && x.p && x.k && x.d)],
  fam:      ['obj',  {}],

  // --- سایر ---
  tx:       ['arr',  []],
  goal:     ['num',  0],
  photos:   ['arr',  []],
  cook:     ['arr',  []],
  hist:     ['arr',  []],
  hist2:    ['arr',  []],
  ach:      ['arr',  []],
  boss:     ['any',  null],
  tree:     ['arr',  []],
  prot:     ['obj',  {}],
  mir:      ['obj',  {}],
  hair:     ['arr',  []],
  exit:     ['obj',  {}],
  ev:       ['arr',  []],
  barber:   ['any',  null],
  shop:     ['obj',  {}],
  sub:      ['obj',  {}],
  links:    ['arr',  []],
  games:    ['arr',  []],
  cmpWk:    ['num',  0],
  tbr:      ['str',  'body'],
  playLog:  ['obj',  {}],
  playPend: ['any',  null],
  hcount:   ['num',  0,    v => v >= 0],
  sec:      ['any',  null],
  flat:     ['bool', false],

  amoled:   ['bool', 0],
  fsz:      ['num',  0],
  bkWk:     ['num',  0],
  stat:     ['shape', { body: 32, look: 28, mind: 38, disc: 15, social: 30, money: 8 }],
  blk:      ['shape', { ig: 1, ir: 1, x: 1, adult: 1, games: 1, short: 1, tg: 0 }]
};

/**
 * یک مقدار را بر اساس توصیف اسکیما تمیز می‌کند.
 * هرگز throw نمی‌کند — بدترین حالت، پیش‌فرض برمی‌گرداند.
 */
function coerce(type, value, fallback, check) {
  const clone = () => JSON.parse(JSON.stringify(fallback));
  switch (type) {
    case 'num':
      if (typeof value !== 'number' || isNaN(value)) return fallback;
      return (check && !check(value)) ? fallback : value;
    case 'str':
      return typeof value === 'string' ? value : fallback;
    case 'bool':
      return (value === 1 || value === 0 || value === true || value === false)
        ? value : fallback;
    case 'arr': {
      if (!Array.isArray(value)) return clone();
      return check ? check(value) : value;
    }
    case 'obj':
      return (value && typeof value === 'object' && !Array.isArray(value))
        ? value : clone();
    case 'shape': {
      const out = (value && typeof value === 'object' && !Array.isArray(value))
        ? value : {};
      for (const k in fallback) {
        if (typeof out[k] !== 'number' || isNaN(out[k])) out[k] = fallback[k];
      }
      return out;
    }
    default:
      return value === undefined ? fallback : value;
  }
}

/* ---------- مهاجرت‌ها ----------
   هر تابع داده را از نسخهٔ قبل به نسخهٔ خودش می‌برد.
   داده‌ای که نسخه ندارد، نسخهٔ ۱ فرض می‌شود. */
const MIGRATIONS = {
  2: s => {
    // نسخهٔ ۲: streak/best از عدد ساده به شیء تبدیل شدند
    if (typeof s.streak === 'number') s.streak = { clean: s.streak, train: 0, sleep: 0, screen: 0 };
    if (typeof s.best === 'number') s.best = { clean: s.best, train: 0, sleep: 0, screen: 0 };
    return s;
  },
  3: s => {
    // نسخهٔ ۳: تاریخ‌ها از UTC به محلی رفتند.
    // ثبت‌های قدیمی ممکن است یک روز جابه‌جا باشند ولی قابل بازسازی نیستند،
    // پس فقط ساختارهای جدید را تضمین می‌کنیم.
    if (!Array.isArray(s.hts)) s.hts = [];
    if (!Array.isArray(s.urges)) s.urges = [];
    if (!Array.isArray(s.ftest)) s.ftest = [];
    if (!s.fam || typeof s.fam !== 'object') s.fam = {};
    if (!s.shop || typeof s.shop !== 'object') s.shop = {};
    return s;
  }
};

/**
 * نقطهٔ ورود: داده را مهاجرت می‌دهد، اعتبارسنجی می‌کند و برمی‌گرداند.
 * @returns {{state: object, migrated: number[], dropped: string[]}}
 */
function migrate(raw) {
  const state = (raw && typeof raw === 'object' && !Array.isArray(raw)) ? raw : {};
  const from = typeof state.v === 'number' ? state.v : 1;
  const applied = [];

  for (let v = from + 1; v <= SCHEMA_VERSION; v++) {
    const fn = MIGRATIONS[v];
    if (!fn) continue;
    try { fn(state); applied.push(v); }
    catch (e) { /* مهاجرت شکست خورد — اسکیما در ادامه نجاتش می‌دهد */ }
  }

  // اعتبارسنجی همهٔ کلیدهای شناخته‌شده
  for (const key in SCHEMA) {
    const [type, def, check] = SCHEMA[key];
    state[key] = coerce(type, state[key], def, check);
  }

  // کلیدهای ناشناخته را نگه می‌داریم (ممکن است از نسخهٔ جدیدتر باشند)
  const dropped = [];
  state.v = SCHEMA_VERSION;
  return { state, migrated: applied, dropped };
}

/** فشرده‌سازی: ثبت‌های قدیمی‌تر از یک سال حذف می‌شوند تا داده بی‌حد رشد نکند */
function compact(state, maxDays = 400) {
  const cut = new Date(Date.now() - maxDays * 864e5);
  const cutStr = cut.getFullYear() + '-' +
    String(cut.getMonth() + 1).padStart(2, '0') + '-' +
    String(cut.getDate()).padStart(2, '0');
  let removed = 0;

  ['done', 'q'].forEach(k => {
    const o = state[k];
    if (!o) return;
    Object.keys(o).forEach(key => {
      const d = key.split('|')[0];
      if (d && d < cutStr) { delete o[key]; removed++; }
    });
  });

  ['jr', 'wo', 'inter'].forEach(k => {
    if (!Array.isArray(state[k])) return;
    const before = state[k].length;
    state[k] = state[k].filter(x => !x || !x.d || x.d >= cutStr);
    removed += before - state[k].length;
  });

  return removed;
}

if (typeof module !== 'undefined') module.exports = {
  SCHEMA_VERSION, SCHEMA, MIGRATIONS, coerce, migrate, compact
};

/* ---------- Jalali date ---------- */
function toJalali(gy, gm, gd) {
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = gy <= 1600 ? 0 : 979;
  gy -= gy <= 1600 ? 621 : 1600;
  const gy2 = gm > 2 ? gy + 1 : gy;
  let days = 365*gy + ((gy2+3)/4|0) - ((gy2+99)/100|0) + ((gy2+399)/400|0) - 80 + gd + g_d_m[gm-1];
  jy += 33*((days/12053)|0); days %= 12053;
  jy += 4*((days/1461)|0); days %= 1461;
  if (days > 365) { jy += ((days-1)/365)|0; days = (days-1)%365; }
  const jm = days < 186 ? 1 + ((days/31)|0) : 7 + (((days-186)/30)|0);
  const jd = 1 + (days < 186 ? days%31 : (days-186)%30);
  return [jy, jm, jd];
}
const JM = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const JW = ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
function jToday(d = new Date()) { return toJalali(d.getFullYear(), d.getMonth()+1, d.getDate()); }
function jStr(d = new Date()) { const j = jToday(d); return `${JW[d.getDay()]} ${j[2]} ${JM[j[1]-1]}`; }
function ageNow() {
  const j = jToday(), [by,bm,bd] = P.birth;
  let a = j[0]-by; if (j[1] < bm || (j[1]===bm && j[2]<bd)) a--; return a;
}
function daysToBirthday() {
  const j = jToday(); const n = new Date();
  let t = new Date(n); let c = 0;
  while (c < 400) { const jj = jToday(t); if (jj[1]===P.birth[1] && jj[2]===P.birth[2]) return c; t.setDate(t.getDate()+1); c++; }
  return 0;
}

/* ================= ADAPTIVE ENGINE ================= */
function adapt(hist){
  // hist: [{d, rate}] نرخ تکمیل روزانه
  const out=[];
  if(!hist.length) return out;
  const last7=hist.slice(-7), avg=last7.reduce((a,x)=>a+x.rate,0)/last7.length;
  if(avg<0.45) out.push(['بار برنامه زیاد است','نرخ تکمیل زیر ۴۵٪. دو بلوک کم‌اولویت حذف شود تا ریتم برگردد.']);
  else if(avg>0.9) out.push(['ظرفیت آزاد داری','نرخ تکمیل بالای ۹۰٪. یک بلوک مهارت یا تمرین اضافه کن.']);
  else out.push(['تعادل مناسب','نرخ تکمیل در محدودهٔ بهینه است. تغییری لازم نیست.']);
  return out;
}

/* پیشنهاد اضافه‌بار تدریجی: اگر در آخرین جلسه همهٔ ست‌ها در سقف تکرار بود، وزنه بالا برود */
function overload(hist,bw){
  if(!hist||!hist.length) return null;
  const last = hist[hist.length-1];
  if(bw){ // وزن بدن: اضافه‌بار از راه تکرار و ست
    if(last.r >= 20) return {w:last.w, r:12, s:(last.s||3)+1, why:'به ۲۰ تکرار رسیدی — یک ست اضافه کن و تکرار به ۱۲ برگردد'};
    return {w:last.w, r:last.r+1, s:last.s||3, why:'یک تکرار بیشتر از جلسهٔ قبل'};
  }
  if(last.r >= 12) return {w: Math.round((last.w*1.05)*2)/2, r: 8, why:'سقف تکرار زده شد — وزنه ۵٪ بالا، تکرار به ۸ برگردد'};
  if(last.r >= 8)  return {w: last.w, r: last.r+1, why:'همان وزنه، یک تکرار بیشتر'};
  return {w: last.w, r: Math.max(6,last.r), why:'تثبیت — همان وزنه تا رسیدن به ۸ تکرار'};
}

/* ================= PATTERN DETECTION ================= */
function patterns(S){
  const out=[];
  // الگوی زمانی لغزش‌ها
  if(S.logs&&S.logs.length>=3){
    const hrs=S.logs.map(l=>new Date(l.d).getHours());
    const late=hrs.filter(h=>h>=21||h<=3).length;
    if(late/hrs.length>=0.6) out.push(['زمان بحرانی تو شب است',
      Math.round(late/hrs.length*100)+'٪ لغزش‌ها بین ۲۱ تا ۰۳ رخ داده. راه‌حل ساختاری: گوشی بیرون اتاق، نه اراده.']);
    const dys=S.logs.map(l=>new Date(l.d).getDay());
    const cnt={};dys.forEach(d=>cnt[d]=(cnt[d]||0)+1);
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
    if(top&&top[1]>=2&&top[1]/dys.length>=0.4) out.push(['روز پرخطر: '+JW[top[0]],
      'بیشترین لغزش‌ها در این روز. برای این روز برنامهٔ فشرده‌تر و بیرون از خانه بچین.']);
  }
  // همبستگی خواب و عملکرد
  if(S.hist&&S.hist.length>=7){
    const r=S.hist.slice(-14);
    const hi=r.filter(x=>x.rate>=0.7).length, lo=r.filter(x=>x.rate<0.4).length;
    if(lo>hi) out.push(['روند نزولی','در ۱۴ روز اخیر روزهای ضعیف بیشتر از روزهای قوی بوده. برنامه را سبک کن تا ریتم برگردد — این شکست نیست، تنظیم است.']);
    else if(hi>=r.length*0.7) out.push(['روند صعودی پایدار','بیش از ۷۰٪ روزها بالای ۷۰٪ تکمیل. ظرفیت اضافه کردن یک هدف جدید را داری.']);
  }
  // همبستگی حال و تمرین
  if(S.jr&&S.jr.length>=5){
    const av=S.jr.slice(-10).reduce((a,x)=>a+ +x.m,0)/Math.min(10,S.jr.length);
    if(av<=2.5) out.push(['حال عمومی پایین','میانگین حال ۱۰ روز اخیر پایین است. اولویت: خواب، نور طبیعی صبح، و ورزش هوازی. اگر بیش از دو هفته ادامه داشت با کسی حرف بزن.']);
    else if(av>=4) out.push(['حال عمومی خوب','میانگین حال بالاست. بهترین زمان برای شروع یک عادت سخت جدید.']);
  }
  if(!out.length) out.push(['داده کافی نیست','برای تشخیص الگو حداقل یک هفته ثبت منظم لازم است. ادامه بده.']);
  return out;
}

function simulate(S){
  const age=ageNow();
  const rate=S.hist&&S.hist.length?S.hist.slice(-14).reduce((a,x)=>a+x.rate,0)/Math.min(14,S.hist.length):0.5;
  const yr=[1,2,5];
  return yr.map(y=>{
    const k=rate*y;
    const h=Math.round(P.h + (y<=3? (y===1?4:y===2?7:9) : 9) * (0.6+rate*0.4));
    const w=Math.round(S.wt[S.wt.length-1] + y*4*(0.5+rate*0.5));
    const lv=Math.floor(Math.sqrt((S.xp + rate*365*y*120)/55))+1;
    return {y, age:age+y, h, w, lv,
      d: rate>=0.75 ? 'در این ریتم، در '+(age+y)+' سالگی جزو یک درصد بالای هم‌سن‌هایت خواهی بود.'
        : rate>=0.45 ? 'ریتم متوسط. نتیجه خوب است ولی نه استثنایی. فاصله تا حالت بهینه قابل جبران است.'
        : 'در این ریتم تغییر محسوسی رخ نمی‌دهد. نرخ تکمیل باید بالای ۵۰٪ برود.'};
  });
}

/* روزهای واقعی سپری‌شده از تولد — با احتساب کبیسه */
function daysLived(d = new Date()) {
  const g = toGregorian(P.birth[0], P.birth[1], P.birth[2]);
  const b = new Date(g[0], g[1]-1, g[2]); b.setHours(0,0,0,0);
  const n = new Date(d); n.setHours(0,0,0,0);
  return Math.max(0, Math.round((n - b) / 864e5));
}
/* روز تا تعیین رشته: ۳۱ خرداد پایان نهم */
function daysToStream(d = new Date()) {
  let t = new Date(d), c = 0;
  while (c < 420) { const j = jToday(t); if (j[1] === 3 && j[2] === 31) return c;
    t.setDate(t.getDate()+1); c++; }
  return 0;
}

/* ================= SMART TIMELINE ================= */
/* انرژی تخمینی بدن در طول روز (۰–۱۰۰) بر اساس ریتم شبانه‌روزی نوجوان */
function energyAt(m){
  const c=[[0,8],[240,5],[300,35],[360,62],[420,78],[540,92],[660,88],[780,70],
           [840,62],[900,80],[1020,85],[1110,70],[1200,52],[1260,34],[1320,18],[1439,10]];
  for(let i=0;i<c.length-1;i++){
    if(m>=c[i][0]&&m<=c[i+1][0]){
      const f=(m-c[i][0])/(c[i+1][0]-c[i][0]);
      return Math.round(c[i][1]+(c[i+1][1]-c[i][1])*f);
    }
  }
  return 50;
}
/* آیا بلوک با سطح انرژی آن ساعت هم‌خوان است؟ */

/* --- Jalali → Gregorian --- */
function toGregorian(jy,jm,jd){
  let gy = jy<=979?621:1600;
  jy -= jy<=979?0:979;
  let days = 365*jy + ((jy/33|0)*8) + (((jy%33)+3)/4|0) + 78 + jd
           + (jm<7 ? (jm-1)*31 : ((jm-7)*30)+186);
  gy += 400*((days/146097)|0); days%=146097;
  if(days>36524){ gy+=100*((--days/36524)|0); days%=36524; if(days>=365)days++ }
  gy += 4*((days/1461)|0); days%=1461;
  if(days>365){ gy+=((days-1)/365)|0; days=(days-1)%365 }
  const sal=[0,31,(gy%4===0&&gy%100!==0)||gy%400===0?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm=0; while(gm<13 && days>=sal[gm]){days-=sal[gm];gm++}
  return [gy,gm,days+1];
}
function jIsLeap(jy){const r=jy%33;return [1,5,9,13,17,22,26,30].includes(r)}
function jDaysInMonth(jy,jm){return jm<=6?31:(jm<=11?30:(jIsLeap(jy)?30:29))}

/* --- تشخیص روز --- */
function dayInfo(dt){
  dt = dt||new Date();
  const j = toJalali(dt.getFullYear(),dt.getMonth()+1,dt.getDate());
  const key = j[1]+'-'+j[2];
  const dow = dt.getDay();
  const isFri = dow===5;
  const hol = HOL_J[key];
  const sch = SCHOOL_EV[key];
  const off = !!(isFri || (hol && hol[1]===1));
  return {
    j, key, dow, dowName:JW[dow], isFri,
    holiday: hol?hol[0]:null, official: !!(hol&&hol[1]===1),
    occasion: hol&&hol[1]===0?hol[0]:null,
    schoolEvent: sch?sch[0]:null, schoolType: sch?sch[1]:null,
    off, season: jSeason(j[1]),
    monthName: JM[j[1]-1],
    daysInMonth: jDaysInMonth(j[0],j[1]),
    isSchoolPeriod: j[1]>=7 && j[1]<=12,
    isRamadanish: false
  };
}

function upcoming(n){
  const out=[]; const t=new Date();
  for(let i=0;i<400 && out.length<n;i++){
    const d=new Date(t); d.setDate(d.getDate()+i);
    const inf=dayInfo(d);
    if(inf.holiday||inf.schoolEvent){
      out.push({in:i, d:inf.j[2]+' '+inf.monthName,
        t:inf.holiday||inf.schoolEvent,
        k:inf.official?'hol':inf.schoolEvent?'sch':'occ'});
    }

      out.push({in:i,d:inf.j[2]+' '+inf.monthName,t:'تولد '+fa(inf.j[0]-P.birth[0])+' سالگی',k:'bd'});

}

/* --- ساعت طلوع/غروب تقریبی تهران --- */
function sunTimes(){
  const j=jToday(), doy=(j[1]<=6?(j[1]-1)*31:186+(j[1]-7)*30)+j[2];
  const dec=23.45*Math.sin(2*Math.PI*(doy-80)/365.25);
  const lat=35.7*Math.PI/180, d=dec*Math.PI/180;
  const ha=Math.acos(-Math.tan(lat)*Math.tan(d))*180/Math.PI/15;
  const noon=12*60+15;
  return {rise:Math.round(noon-ha*60), set:Math.round(noon+ha*60), len:Math.round(ha*120)};
}

function studyPlan(S){
  const done=S.stLog||{};
  return SUBJ.map(s=>{
    const w=s[3]*DIFF_W[s[4]];
    const minsWeek=Math.round(w*22);           // دقیقهٔ پیشنهادی در هفته
    const wk=weekKey();
    const got=(done[wk]&&done[wk][s[0]])||0;
    return {k:s[0],t:s[1],ic:s[2],coef:s[3],diff:s[4],d:s[5],
            target:minsWeek,got,pc:Math.min(100,Math.round(got/minsWeek*100))};
  }).sort((a,b)=>b.target-a.target);
}
function weekKey(){const d=new Date();const on=new Date(d.getFullYear(),0,1);
  return d.getFullYear()+'-w'+Math.ceil(((d-on)/864e5+on.getDay()+1)/7)}

/* میانگین و تحلیل نمرات */
function gpa(S){
  const g=S.grades||{};
  let sum=0,wsum=0,list=[];
  SUBJ.forEach(s=>{
    const arr=g[s[0]]||[];
    if(!arr.length)return;
    const av=arr.reduce((a,b)=>a+b.v,0)/arr.length;
    list.push({k:s[0],t:s[1],ic:s[2],av:+av.toFixed(2),n:arr.length,coef:s[3],
      trend:arr.length>=2?+(arr[arr.length-1].v-arr[arr.length-2].v).toFixed(1):0});
    sum+=av*s[3];wsum+=s[3];
  });
  return {avg:wsum?+(sum/wsum).toFixed(2):0, list:list.sort((a,b)=>a.av-b.av)};
}

/* توصیهٔ رشته بر اساس نمرات واقعی */
function streamAdvice(S){
  const G=gpa(S), m={};G.list.forEach(x=>m[x.k]=x.av);
  return STREAMS.map(st=>{
    const ks=Object.keys(st.need);
    let score=0,n=0,gaps=[];
    ks.forEach(k=>{
      if(m[k]!==undefined){n++;
        const r=Math.min(1.15,m[k]/st.need[k]);score+=r;
        if(m[k]<st.need[k])gaps.push(`${(SUBJ.find(s=>s[0]===k)||[])[1]}: ${fa(m[k])} → نیاز ${fa(st.need[k])}`);
      }});
    return {...st, fit:n?Math.round(score/n*100):null, gaps};
  }).sort((a,b)=>(b.fit||0)-(a.fit||0));
}

function examPlan(e){

  if(dd===0)return[['امروز امتحان است','فقط مرور سریع نکات کلیدی. مطلب جدید نخوان.']];

    steps.push(['شب قبل','خواب ۸ ساعت. شب‌بیداری بازده منفی دارد.']);
  }else{
    const daily=Math.ceil(ch/Math.max(1,dd-2));
    steps.push([`روزی ${fa(daily)} فصل`,`${fa(ch)} فصل در ${fa(dd-2)} روز — دو روز آخر برای مرور خالی می‌ماند.`]);

  }
  return steps;
}

  ['teach', '▦','معلم',    'Teacher',   'از او چیزی یاد می‌گیری'],
  ['peer',  '⚔','هم‌رزم',  'Peer',      'هم‌مسیر توست، با هم رشد می‌کنید'],
  ['anchor','⚓','لنگر',    'Anchor',    'در بحران کنارت می‌ماند'],
  ['drain', '▽','فرساینده','Drain',     'وقت و انرژی می‌گیرد، چیزی برنمی‌گرداند']
];
const RMAP = Object.fromEntries(ROLES.map(x=>[x[0],x]));

function dnum(d){const t=new Date(d);return isNaN(t)?0:Math.floor(t.getTime()/864e5)}
function todayN(){return Math.floor(Date.now()/864e5)}

/* آخرین تماس با یک نفر */
function lastSeen(S,id){
  const ls=(S.inter||[]).filter(x=>x.p===id);
  if(!ls.length)return null;
  return Math.max(...ls.map(x=>dnum(x.d)));
}
function daysSince(S,id){const l=lastSeen(S,id);return l===null?null:todayN()-l}

/* گرمای رابطه ۰..۱۰۰ — از تعاملات اخیر با افت نمایی */
function warmth(S,p){
  const ls=(S.inter||[]).filter(x=>x.p===p.id);
  if(!ls.length)return 0;
  const now=todayN(), cad=RING_CAD[p.r]||30;
  let w=0;
  ls.forEach(x=>{
    const age=now-dnum(x.d);
    const hl=cad*2.2;                     /* نیمه‌عمر متناسب با حلقه */
    const decay=Math.pow(.5, age/hl);
    w += ((IMAP[x.k]||['','','','',4])[4]) * decay;
  });
  return Math.max(0,Math.min(100,Math.round(w*2.6)));
}
/* آیا سررسید تماس گذشته؟ */
function overdue(S,p){
  const d=daysSince(S,p.id), cad=RING_CAD[p.r]||30;
  if(d===null)return {due:true,by:null,cad};
  return {due:d>cad, by:d-cad, cad, d};
}
/* توازن داد و ستد: مثبت = تو بیشتر داده‌ای */
function balance(S,id){
  const ls=(S.inter||[]).filter(x=>x.p===id);
  const g=ls.filter(x=>x.k==='help').length, t=ls.filter(x=>x.k==='got').length;
  return {give:g, take:t, net:g-t};
}
/* شاخص سلامت کل شبکه */
function socialHealth(S){
  const P=S.ppl||[];
  if(!P.length)return {score:0, n:0, warm:0, od:0, drain:0, inner:0};
  const ws=P.map(p=>warmth(S,p));
  const warm=Math.round(ws.reduce((a,b)=>a+b,0)/P.length);
  const od=P.filter(p=>overdue(S,p).due).length;
  const drain=P.filter(p=>p.role==='drain'||p.e<0).length;
  const inner=P.filter(p=>p.r==='core').length;
  /* کیفیت شبکه = گرم‌ترین روابط (نه میانگین ساده که با آشنایان رقیق می‌شود) */
  const sorted=ws.slice().sort((a,b)=>b-a);
  const topN=sorted.slice(0,Math.max(1,Math.min(5,sorted.length)));
  const core=Math.round(topN.reduce((a,b)=>a+b,0)/topN.length);
  let s=core*.65+warm*.35;
  s-=od/P.length*20;
  s-=drain/P.length*15;
  if(inner===0)s-=15; else if(inner>RING_CAP.core)s-=8;
  return {score:Math.max(0,Math.min(100,Math.round(s))), n:P.length, warm, od, drain, inner};
}
/* حرکت پیشنهادی امروز — یک اقدام مشخص، نه توصیهٔ کلی */
function socialMoves(S){
  const P=S.ppl||[], out=[];
  P.forEach(p=>{
    const o=overdue(S,p), w=warmth(S,p);
    if(o.due){
      const sev=o.by===null?3:o.by>o.cad?3:o.by>o.cad/2?2:1;
      out.push({p, sev, ic:'◷',
        t:o.by===null?'هنوز تعاملی ثبت نشده':fa(o.d)+' روز بی‌خبری',
        d:p.r==='core'?'هستهٔ درونی با ۳ روز سکوت سرد می‌شود.':'یک پیام کوتاه کافی است.',
        act:'تماس بگیر'});
    } else if(w<25&&(p.r==='core'||p.r==='close')&&o.d!==undefined&&o.d>o.cad/2){
      out.push({p, sev:2, ic:'◌', t:'رابطه در حال سرد شدن', d:'گرمای رابطه '+fa(w)+' از ۱۰۰ است.', act:'یک دیدار'});
    }
    const b=balance(S,p.id);
    if(b.net<=-3)out.push({p, sev:2, ic:'⚖', t:'توازن یک‌طرفه', d:fa(b.take)+' بار کمک گرفته‌ای، '+fa(b.give)+' بار داده‌ای.', act:'جبران کن'});
    if(p.role==='drain')out.push({p, sev:1, ic:'▽', t:'رابطهٔ فرساینده', d:'مرز بگذار یا فاصله را بیشتر کن.', act:'مرزگذاری'});
  });
  return out.sort((a,b)=>b.sev-a.sev||warmth(S,a.p)-warmth(S,b.p)).slice(0,6);
}
/* بینش‌های آماری شبکه */
function socialInsight(S){
  const P=S.ppl||[], I=S.inter||[], out=[];
  if(!P.length)return out;
  const now=todayN();
  const last30=I.filter(x=>now-dnum(x.d)<=30);
  /* پرتماس‌ترین */
  const cnt={}; last30.forEach(x=>cnt[x.p]=(cnt[x.p]||0)+1);
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  if(top){const pp=P.find(x=>x.id===top[0]);
    if(pp)out.push(['◉','بیشترین وقت','در ۳۰ روز گذشته بیشترین تعامل با '+pp.n+' بوده — '+fa(top[1])+' بار.']);}
  /* انرژی خالص */
  const pos=P.filter(p=>p.e>0).length, neg=P.filter(p=>p.e<0).length;
  if(P.length>=3)out.push(['⚡','ترازنامهٔ انرژی',fa(pos)+' نفر انرژی می‌دهند، '+fa(neg)+' نفر می‌گیرند.'+(neg>pos?' این نسبت به ضرر توست.':'')]);
  /* ظرفیت حلقه */
  Object.keys(RING_CAP).forEach(k=>{
    const n=P.filter(p=>p.r===k).length, cap=RING_CAP[k];
    if(cap<900&&n>cap){const R=RINGS.find(x=>x.k===k);
      out.push(['◍','حلقهٔ شلوغ',R.t+' '+fa(n)+' نفر دارد؛ ظرفیت واقعی حدود '+fa(cap)+' نفر است.']);}
  });
  /* تنش */
  const cf=last30.filter(x=>x.k==='conf');
  if(cf.length)out.push(['⚡','تنش اخیر',fa(cf.length)+' تنش در ۳۰ روز گذشته ثبت شده.']);
  /* بدون هسته */
  if(!P.filter(p=>p.r==='core').length)out.push(['○','هستهٔ خالی','هیچ‌کس در هستهٔ درونی نیست. یک یا دو نفر را مشخص کن.']);
  return out;
}
/* آمار ۸ هفتهٔ اخیر برای نمودار */
function socialTrend(S){
  const I=S.inter||[], now=todayN(), w=[];
  for(let i=7;i>=0;i--){
    const a=now-(i+1)*7, b=now-i*7;
    w.push(I.filter(x=>{const d=dnum(x.d);return d>a&&d<=b}).length);
  }
  return w;
}

/* هفتهٔ چندم از شروع */
function obWeek(S) {
  if (!S.startDate) return 99;                 // ثبت نشده = همه باز
  const d = Math.floor((Date.now() - new Date(S.startDate)) / 864e5);
  return Math.floor(d / 7) + 1;
}
/* آیا این کوئست الان باز است؟ */
function obOpen(S, id) {
  if (!S.startDate || S.obOff) return true;
  const w = obWeek(S);
  for (const st of ONBOARD) if (st.ids.includes(id)) return w >= st.w;
  return true;                                  // هرچه در فهرست نیست، باز
}
function obNext(S) {
  const w = obWeek(S);
  return ONBOARD.find(x => x.w > w) || null;
}
function obActive(S) {
  return !!S.startDate && !S.obOff && obWeek(S) <= 6;
}

/* ---------- ۲. محرک لغزش: چرا، نه فقط چند ---------- */
/* شمردن روز نمی‌گوید چرا می‌لغزی. این می‌گوید. */
const TRIGGERS = [
  ['tired',  'خستگی'],
  ['alone',  'تنهایی'],
  ['bored',  'بی‌حوصلگی'],
  ['stress', 'استرس'],
  ['social', 'بعد از شبکهٔ اجتماعی'],
  ['night',  'بیداری دیروقت'],
  ['sad',    'حال بد']
];
const TRG_MAP = Object.fromEntries(TRIGGERS.map(t => [t[0], t[1]]));

/* تحلیل: ساعت خطر، مکان خطر، محرک غالب */
function trgAnalyze(S) {
  const L = (S.urges || []).filter(x => x && typeof x.h === 'number');
  if (L.length < 5) return null;
  const byH = {};
  L.forEach(x => { const b = Math.floor(x.h / 3) * 3; byH[b] = (byH[b] || 0) + 1; });
  const hTop = Object.entries(byH).sort((a, b) => b[1] - a[1])[0];
  const byT = {};
  L.forEach(x => { if (x.t) byT[x.t] = (byT[x.t] || 0) + 1; });
  const tTop = Object.entries(byT).sort((a, b) => b[1] - a[1])[0];
  const resisted = L.filter(x => x.r).length;
  return {
    n: L.length,
    resisted,
    rate: Math.round(resisted / L.length * 100),
    hour: hTop ? +hTop[0] : null,
    hourPc: hTop ? Math.round(hTop[1] / L.length * 100) : 0,
    trg: tTop ? tTop[0] : null,
    trgPc: tTop ? Math.round(tTop[1] / L.length * 100) : 0
  };
}
/* راه‌حل مهندسی بر اساس محرک غالب — نه توصیهٔ اخلاقی */

    sad:    'حال بد محرک توست. با یک نفر حرف بزن — این مؤثرتر از مقاومت تنهاست.'

  return F[k] || 'داده را ادامه بده تا الگو روشن شود.';

/* ---------- ۳. تست‌های دورهٔ بدنی: آینه دروغ می‌گوید، عدد نه ---------- */
const FTEST = [
  ['sprint', 'سرعت ۲۰ متر', 'ثانیه', 1, 'کمتر بهتر — با گوشی کرنومتر بگیر'],
  ['vjump',  'پرش عمودی',   'cm',    0, 'کنار دیوار، گچ روی انگشت'],
  ['pushup', 'شنا بیشینه',  'تکرار', 0, 'تا ناتوانی، فرم درست'],
  ['plank',  'پلانک',       'ثانیه', 0, 'تا شکستن فرم'],
  ['sitreach','انعطاف',     'cm',    0, 'نشسته، دست به پنجه'],
  ['run',    'دوی ۱۲ دقیقه','متر',   0, 'تست کوپر — استقامت']
];
const FT_MAP = Object.fromEntries(FTEST.map(f => [f[0], f]));

/* آخرین و قبلی برای مقایسه */
function ftLast(S, k) {
  const L = (S.ftest || []).filter(x => x.k === k).sort((a, b) => a.d < b.d ? -1 : 1);
  return { last: L[L.length - 1] || null, prev: L[L.length - 2] || null, all: L };
}
function ftDelta(S, k) {
  const { last, prev } = ftLast(S, k);
  if (!last || !prev) return null;
  const lower = FT_MAP[k] && FT_MAP[k][3] === 1;
  const diff = last.v - prev.v;
  const better = lower ? diff < 0 : diff > 0;
  const pc = prev.v ? Math.abs(diff / prev.v * 100) : 0;
  return { diff, better, pc: Math.round(pc * 10) / 10 };
}
/* هر ۶ هفته موعد تست */
function ftDue(S) {
  const all = (S.ftest || []);
  if (!all.length) return true;
  const last = all.map(x => x.d).sort().pop();
  return (Date.now() - new Date(last)) / 864e5 >= 42;
}

/* ---------- ۴. بدهی خواب: یک شب بد، سه روز اثر ---------- */
function sleepDebt(S) {
  const NEED = 8.5;                       // ۱۴ ساله در دورهٔ رشد
  const L = S.sleepLog || {};
  const keys = Object.keys(L).sort().slice(-7);
  if (!keys.length) return null;
  let debt = 0;
  keys.forEach(k => { const h = +L[k]; if (!isNaN(h)) debt += Math.max(0, NEED - h); });
  const avg = keys.reduce((a, k) => a + (+L[k] || 0), 0) / keys.length;
  return {
    debt: Math.round(debt * 10) / 10,
    avg: Math.round(avg * 10) / 10,
    nights: keys.length,
    need: NEED,
    /* بدهی بالای ۵ ساعت یعنی افت محسوس تمرکز و ریکاوری */
    bad: debt >= 5
  };
}
/* ساعت خواب پیشنهادی امشب: اگر فردا مهم است، زودتر */
function sleepTarget(S, tomorrowBig) {
  const d = sleepDebt(S);
  let extra = 0;
  if (d && d.debt >= 3) extra += 30;
  if (tomorrowBig) extra += 30;
  return extra;                            // دقیقه زودتر از ساعت عادی
}

/* ---------- ۵. فصل ۱۲ هفته‌ای: نقطهٔ پایان و شروع تازه ---------- */
const SEASON_LEN = 84;                     // روز
function seasonNow(S) {
  if (!S.startDate) return null;
  const d = Math.floor((Date.now() - new Date(S.startDate)) / 864e5);
  const n = Math.floor(d / SEASON_LEN) + 1;
  const dayIn = d % SEASON_LEN;
  return {
    n,
    day: dayIn + 1,
    left: SEASON_LEN - dayIn,
    pc: Math.round((dayIn + 1) / SEASON_LEN * 100),
    week: Math.floor(dayIn / 7) + 1
  };
}

function shopList(S) {

/* ---------- ۱. منحنی رشد قد ---------- */
/* در ۱۴ سالگی جذاب‌ترین نمودار همین است */
function htAdd(S, cm) {
  if (!Array.isArray(S.hts)) S.hts = [];
  const d = _dstr(new Date());
  const i = S.hts.findIndex(x => x.d === d);
  if (i >= 0) S.hts[i].v = cm; else S.hts.push({ d, v: cm });
  S.hts.sort((a, b) => a.d < b.d ? -1 : 1);
  return S.hts;
}
function htStats(S) {
  const L = (S.hts || []).filter(x => x && typeof x.v === 'number');
  if (!L.length) return null;
  const first = L[0], last = L[L.length - 1];
  const days = Math.max(1, (new Date(last.d) - new Date(first.d)) / 864e5);
  const grown = last.v - first.v;
  /* نرخ سالانه — در جهش رشد نوجوانی ۵ تا ۹ سانت طبیعی است */
  const perYear = days >= 30 ? Math.round(grown / days * 365 * 10) / 10 : null;
  return {
    n: L.length, first: first.v, last: last.v,
    grown: Math.round(grown * 10) / 10,
    perYear, days: Math.round(days),
    spurt: perYear !== null && perYear >= 5
  };
}

}

/* ---------- ۳. یادآور خانواده ---------- */
/* ساده ولی اثرش زیاد است */
const FAM = [
  ['gp', 'پدربزرگ و مادربزرگ', 7],
  ['par', 'گفتگوی بی‌گوشی با پدر یا مادر', 3],
  ['sib', 'وقت با خواهر یا برادر', 5]
];
function famDue(S) {
  const out = [];
  FAM.forEach(([k, t, cad]) => {
    const last = (S.fam && S.fam[k]) || null;
    const days = last ? Math.floor((Date.now() - new Date(last)) / 864e5) : 999;
    out.push({ k, t, cad, last, days, due: days >= cad });
  });
  return out;
}
function famLog(S, k) {
  if (!S.fam) S.fam = {};
  S.fam[k] = _dstr(new Date());
  return S.fam;
}
/* تشخیص انزوا: چند روز بدون هیچ تعامل حضوری */
function isolationDays(S) {
  const dates = [];
  (S.inter || []).forEach(x => { if (x && x.d && (x.k === 'meet' || x.k === 'deep' || x.k === 'play')) dates.push(x.d); });
  Object.values(S.fam || {}).forEach(d => dates.push(d));
  if (!dates.length) return null;
  const last = dates.sort().pop();
  return Math.floor((Date.now() - new Date(last)) / 864e5);
}

/* ---------- ۴. یک سال پیش امروز ---------- */
/* قوی‌ترین حس پیشرفت */
function yearAgo(S) {
  const t = new Date();
  const target = _dstr(new Date(t.getFullYear() - 1, t.getMonth(), t.getDate()));
  const j = (S.jr || []).find(x => x.d === target);
  const w = (S.wt || []).length > 1 ? S.wt[0] : null;
  const h = (S.hts || []).find(x => x.d <= target);
  return (j || h) ? { date: target, jr: j || null, ht: h || null } : null;
}
/* خاطرهٔ N روز پیش وقتی یک سال داده نداریم */
function memoryBack(S, days) {
  const target = _dstr(new Date(Date.now() - days * 864e5));
  const j = (S.jr || []).find(x => x.d === target);
  return j ? { date: target, jr: j, days } : null;
}

if (typeof module !== 'undefined') Object.assign(module.exports, {
  htAdd, htStats, BREATH, breathTotal,
  FAM, famDue, famLog, isolationDays, yearAgo, memoryBack
});

/* ============================================================
   BRIEF — یک جمله، نه یک داشبورد
   اپ باید اول حرف بزند، نه منتظر بماند تو بروی سراغش.
   ============================================================ */

/**
 * مهم‌ترین جملهٔ همین لحظه را برمی‌گرداند.
 * ترتیب اولویت: هشدار سلامت > تعارض برنامه > فرصت > تشویق.
 * اگر چیزی برای گفتن نیست null — اپی که هر روز حرف بزند نویز است.
 */
function brief(S, ctx) {
  const c = ctx || {};
  const hour = c.hour !== undefined ? c.hour : new Date().getHours();
  const out = [];

  /* ۱. بدهی خواب + روز تمرین = ریسک آسیب */
  const sd = sleepDebt(S);
  if (sd && sd.bad && c.training) {
    out.push({ p: 1, ic: '✚', t: 'دیشب کم خوابیدی و امروز تمرین داری. شدت را کم کن — در سن تو کم‌خوابی و بار زیاد با هم، آسیب می‌سازد.' });
  } else if (sd && sd.bad) {
    out.push({ p: 2, ic: '●', t: 'بدهی خواب هفتگی‌ات ' + Math.round(sd.debt) + ' ساعت است. امشب زودتر بخواب — این بیشترین اثر را روی قد و تمرکز دارد.' });
  }

  /* ۲. روند نزولی حال */
  const j7 = (S.jr || []).slice(-7).filter(x => x.m);
  if (j7.length >= 5) {
    const low = j7.filter(x => +x.m <= 2).length;
    if (low >= 5) out.push({ p: 1, ic: '◈', t: 'پنج روز از هفت روز گذشته حالت پایین بوده. با یک بزرگ‌تر که بهش اعتماد داری حرف بزن.' });
  }

  /* ۳. ساعت خطر وسوسه */
  const tg = trgAnalyze(S);
  if (tg && tg.hour !== null && hour >= tg.hour && hour < tg.hour + 3 && tg.n >= 5) {
    out.push({ p: 2, ic: '▲', t: 'این بازه ساعت خطر توست. ' + trgFix(tg.trg) });
  }

  /* ۴. استریک در آستانهٔ رکورد */
  const st = S.streak || {}, bs = S.best || {};
  ['clean', 'train', 'sleep'].forEach(k => {
    if (st[k] && bs[k] && st[k] === bs[k] - 1 && st[k] > 5)
      out.push({ p: 3, ic: '◆', t: 'یک روز تا شکستن رکورد ' + bs[k] + ' روزه‌ات مانده.' });
  });

  /* ۵. تست بدنی سررسید */
  if (ftDue(S) && (S.ftest || []).length > 0)
    out.push({ p: 4, ic: '◎', t: 'شش هفته از آخرین تست بدنی گذشته. امروز دوباره بسنج تا پیشرفت را با عدد ببینی.' });

  /* ۶. خانواده — فقط وقتی قبلاً ثبتی بوده.
        کاربر تازه نباید با یادآوری چیزی که هرگز شروع نکرده روبه‌رو شود. */
  if (S.fam && Object.keys(S.fam).length) {
    const fam = famDue(S).filter(f => f.due && f.last && f.days > f.cad * 2);
    if (fam.length) out.push({ p: 4, ic: '◈', t: fam[0].t + ' — ' + fam[0].days + ' روز گذشته. یک تماس کوتاه کافی است.' });
  }

  /* ۷. انزوا */
  const iso = isolationDays(S);
  if (iso !== null && iso >= 5)
    out.push({ p: 3, ic: '◇', t: iso + ' روز است تعامل حضوری ثبت نشده. امروز یک نفر را ببین.' });

  if (!out.length) return null;
  out.sort((a, b) => a.p - b.p);
  return out[0];
}

if (typeof module !== 'undefined') Object.assign(module.exports, { brief });

'study_deep':{ex:'ریاضی، فصل ۳. اول ۱۰ دقیقه درس را می‌خوانی، بعد کتاب را می‌بندی و سعی می‌کنی خودت مسئله را حل کنی. جایی که گیر کردی، دقیقاً همان‌جا ضعف توست — برمی‌گردی همان بخش را می‌خوانی.',

'study_mem':{ex:'عربی. متن را یک بار می‌خوانی، بعد کاغذ را می‌پوشانی و از حفظ می‌گویی. هر کلمه‌ای که یادت نیامد می‌شود یک کارت مرور که فردا و سه روز بعد دوباره می‌بینی.',
 how:['متن را یک بار کامل و با دقت بخوان.','متن را بپوشان و از حفظ بازگو کن — بلند، با صدای خودت.','هرچه یادت نیامد را جدا بنویس.','فقط همان بخش‌های فراموش‌شده را دوباره بخوان.','برای هرکدام یک کارت مرور بساز.','فاصله‌گذاری کن: امروز، فردا، ۳ روز بعد، ۷ روز بعد.','قبل از خواب یک مرور سریع — خواب حافظه را تثبیت می‌کند.','فردا صبح دوباره امتحان کن.','کارت‌های سررسیدشده را در اپ مرور کن.'],

'study_weak':{ex:'اپ می‌گوید پایین‌ترین نمره‌ات عربی است. به‌جای خواندن دوبارهٔ کل کتاب، فقط سه مبحثی که در آزمون آخر غلط زدی را برمی‌داری و روی همان‌ها تمرین می‌کنی.',

'study_exam':{ex:'شب قبل امتحان، درس جدید نمی‌خوانی. فقط خلاصه‌ها و غلط‌های قبلی را مرور می‌کنی و ساعت ۲۱ می‌خوابی — چون خواب بیشتر از دو ساعت مرور اضافه به نمره کمک می‌کند.',

'lunch':{ex:'بعد از مدرسه: برنج با خورش و سالاد. پروتئین اصلی را اول می‌خوری. بدون کدو و بادمجان.',

/* امتیاز مهارت: هر ۳ سطح، ۱ امتیاز + امتیاز پایه */
function skillPoints(S){
  const earned=2+Math.floor(lvl(S.xp)/2);
  const spent=(S.tree||[]).reduce((a,id)=>a+((NMAP[id]||{cost:0}).cost||0),0);
  return {earned, spent, free:Math.max(0,earned-spent)};
}
function nodeState(S,n){
  const un=(S.tree||[]).includes(n.id);
  const pre=n.pre.every(p=>(S.tree||[]).includes(p));
  let r={have:0,need:1,u:''};
  try{r=n.req(S)}catch(e){}
  const pc=Math.max(0,Math.min(100,Math.round(r.have/r.need*100)));
  const met=r.have>=r.need;
  const sp=skillPoints(S);
  return {un, pre, met, pc, r, afford:sp.free>=n.cost,
    can: !un && pre && met && sp.free>=n.cost};
}
function branchProgress(S,b){
  const ns=NODES.filter(n=>n.b===b);
  const un=ns.filter(n=>(S.tree||[]).includes(n.id)).length;
  return {un, total:ns.length, pc:Math.round(un/ns.length*100)};
}
function treeRank(S){
  const n=(S.tree||[]).length, t=NODES.length;
  const pc=n/t*100;
  if(pc>=90)return ['استاد','Master'];
  if(pc>=70)return ['کهنه‌کار','Veteran'];
  if(pc>=50)return ['ورزیده','Adept'];
  if(pc>=30)return ['کارآموز','Apprentice'];
  if(pc>=10)return ['تازه‌کار','Novice'];
  return ['آغازگر','Initiate'];
}
/* پیشنهاد گرهٔ بعدی: نزدیک‌ترین به تکمیل */
function nextNodes(S){
  return NODES.map(n=>({n,st:nodeState(S,n)}))
    .filter(x=>!x.st.un&&x.st.pre)
    .sort((a,b)=>b.st.pc-a.st.pc).slice(0,3);
}

/* ================= READINESS INDEX ================= */
function readiness(S){
  const d=td();
  const j=(S.jr||[]).find(x=>x.d===d);
  const mood=j?+j.m:3;
  const sl=S.sleepLog&&S.sleepLog[d]!==undefined?S.sleepLog[d]:8;
  const load=(S.wo||[]).filter(w=>(Date.now()-new Date(w.t))/864e5<=3).length;
  const avg=(S.wo||[]).length?S.wo.length/Math.max(1,Math.ceil((Date.now()-new Date(S.wo[0].t))/6048e5)):2;
  let sc=50;
  sc += (sl-7)*11;                       // خواب: مهم‌ترین عامل
  sc += (mood-3)*7;                      // حال
  sc -= Math.max(0,load-avg*0.6)*8;      // خستگی تجمعی
  if(S.streak && S.streak.clean>3) sc+=4;
  sc=Math.max(5,Math.min(100,Math.round(sc)));
  const v = sc>=78?['اوج','امروز می‌توانی سخت‌ترین کارها را بزنی. فشار بیاور.']
          : sc>=58?['خوب','ظرفیت عادی. برنامه را کامل اجرا کن.']
          : sc>=38?['متوسط','شدت را کم کن ولی متوقف نشو. کیفیت به جای حجم.']
          : ['پایین','امروز فقط حداقل‌ها. ریکاوری اولویت است — این هوشمندی است نه تنبلی.'];
  return {sc, lbl:v[0], msg:v[1], sl, mood};
}

  const wo=(S.wo||[]).filter(w=>(Date.now()-new Date(w.t))/864e5<=7).length;

  const tot=Math.round(p.reduce((a,x)=>a+x[1],0)/p.length);
  return {parts:p, total:tot,

  const dys={};l.forEach(x=>{const d=new Date(x.d).getDay();dys[d]=(dys[d]||0)+1});
  const top=Object.entries(dys).sort((a,b)=>b[1]-a[1])[0];
  if(!top||top[1]<2)return null;
  const tg=+top[0], now=new Date().getDay();
  const inD=(tg-now+7)%7;
  return {day:JW[tg], inD, n:top[1],
    msg:`از ${fa(l.length)} لغزش ثبت‌شده، ${fa(top[1])} مورد در ${JW[tg]} رخ داده. ${inD===0?'امروز همان روز است.':'تا '+fa(inD)+' روز دیگر.'} برای آن روز از قبل برنامهٔ بیرون از خانه بچین.`};
}

/* ================= MULTIVARIATE ================= */
function multiVar(S){
  const out=[];const d=S.hist||[];
  if(d.length<10){out.push(['داده کافی نیست','برای تحلیل چندمتغیره حداقل ۱۰ روز داده لازم است.']);return out}
  const sl=S.sleepLog||{};
  const low=d.filter(x=>sl[x.d]!==undefined&&sl[x.d]<7);
  const high=d.filter(x=>sl[x.d]!==undefined&&sl[x.d]>=8);
  if(low.length>=3&&high.length>=3){
    const a=low.reduce((x,y)=>x+y.rate,0)/low.length, b=high.reduce((x,y)=>x+y.rate,0)/high.length;
    const df=Math.round((b-a)*100);
    if(Math.abs(df)>=8) out.push(['خواب ← اجرای برنامه',
      `در روزهای با خواب ۸+ ساعت، نرخ اجرای تو ${fa(Math.abs(df))}٪ ${df>0?'بالاتر':'پایین‌تر'} است. این قوی‌ترین اهرم توست.`]);
  }
  const jr=S.jr||[];
  if(jr.length>=8){
    const good=jr.filter(x=>+x.m>=4).map(x=>x.d), bad=jr.filter(x=>+x.m<=2).map(x=>x.d);
    const rg=d.filter(x=>good.includes(x.d)), rb=d.filter(x=>bad.includes(x.d));
    if(rg.length>=2&&rb.length>=2){
      const a=rg.reduce((x,y)=>x+y.rate,0)/rg.length, b=rb.reduce((x,y)=>x+y.rate,0)/rb.length;
      out.push(['حال ← اجرا',`در روزهای با حال خوب، اجرای تو ${fa(Math.round((a-b)*100))}٪ بهتر است. حال، نتیجه است نه علت — با خواب و تمرین بسازش.`]);
    }
  }
  if((S.logs||[]).length>=3&&Object.keys(sl).length>=5){
    const ld=(S.logs||[]).map(x=>x.d.slice(0,10));
    const slp=ld.filter(x=>sl[x]!==undefined&&sl[x]<7).length;
    if(slp>=2) out.push(['کم‌خوابی ← لغزش',
      `${fa(slp)} مورد از لغزش‌ها در روزهایی بوده که کمتر از ۷ ساعت خوابیده‌ای. خواب، اراده را می‌سازد.`]);
  }
  if(!out.length)out.push(['هنوز الگوی معناداری پیدا نشد','به ثبت ادامه بده. تحلیل با داده بیشتر دقیق‌تر می‌شود.']);
  return out;
}

/* ============ ASK — in-app dialog engine (replaces browser prompt/confirm) ============ */
let _askQ=null;
/* ask(spec) -> Promise
   spec.f = [{k,t,ty:'num'|'text'|'area'|'pick'|'time'|'date'|'rate'|'chips',o:[],v,ph,hint,min,max,st}] */
function ask(spec){return new Promise(res=>{
  const f=(spec.f||[]).map(x=>({...x,v:x.v===undefined?'':x.v}));
  _askQ={spec,f,res};
  document.getElementById('askw').innerHTML=askHTML(spec,f);
  document.getElementById('askw').classList.add('on');
  document.body.style.overflow='hidden';
  setTimeout(()=>{const el=document.querySelector('#askw input,#askw textarea');if(el){el.focus();el.select&&el.select()}},60);
})}
function askHTML(sp,f){
  return `<div class="askbd" onclick="askX(0)"></div>
  <div class="askc gl">
   <div class="askh"><div><div class="askt">${sp.t||''}</div>
    ${sp.s?`<div class="asks">${sp.s}</div>`:''}</div>
    <button class="askcl" onclick="askX(0)">✕</button></div>
   <div class="askb">${f.map((x,i)=>askF(x,i)).join('')}</div>
   <div class="askft">
    ${sp.del?`<button class="bt dg" onclick="askX(2)">${sp.del}</button>`:''}
    <button class="bt" onclick="askX(0)">${L('انصراف','Cancel')}</button>
    <button class="bt p" onclick="askX(1)">${sp.ok||L('تأیید','Confirm')}</button></div></div>`}
function askF(x,i){
  const lb=x.t?`<div class="askl">${x.t}${x.hint?`<span>${x.hint}</span>`:''}</div>`:'';
  let b='';
  if(x.ty==='pick')
    b=`<div class="askp">${x.o.map((o,j)=>`<button class="askpb${String(x.v)===String(askV(o))?' on':''}" onclick="askS(${i},'${String(askV(o)).replace(/'/g,"\\'")}')">${askT(o)}</button>`).join('')}</div>`;
  else if(x.ty==='chips')
    b=`<div class="askp">${x.o.map(o=>`<button class="askpb${(x.v||'')===askV(o)?' on':''}" onclick="askS(${i},'${askV(o).replace(/'/g,"\\'")}')">${askT(o)}</button>`).join('')}</div>`;
  else if(x.ty==='rate'){const mx=x.max||5;
    b=`<div class="askp">${Array.from({length:mx},(_,j)=>`<button class="askpb r${+x.v===j+1?' on':''}" onclick="askS(${i},${j+1})">${fa(j+1)}</button>`).join('')}</div>`}
  else if(x.ty==='info')
    b=`<div class="askinf">${(x.rows||[]).map(r=>`<div class="askir"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>`;
  else if(x.ty==='area')
    b=`<textarea class="aski ta" rows="4" placeholder="${x.ph||''}" oninput="askS(${i},this.value,1)">${x.v||''}</textarea>`;
  else if(x.ty==='num')
    b=`<div class="asknum"><button class="askst" onclick="askN(${i},-${x.st||1})">−</button>
       <input class="aski n" type="number" inputmode="decimal" value="${x.v}" placeholder="${x.ph||''}" oninput="askS(${i},this.value,1)">
       <button class="askst" onclick="askN(${i},${x.st||1})">+</button>${x.u?`<span class="asku">${x.u}</span>`:''}</div>`;
  else
    b=`<input class="aski" type="${x.ty==='time'?'time':x.ty==='date'?'date':'text'}" value="${x.v}" placeholder="${x.ph||''}" oninput="askS(${i},this.value,1)">`;
  return `<div class="askfd" id="askfd${i}">${lb}${b}</div>`}
const askV=o=>Array.isArray(o)?o[0]:o, askT=o=>Array.isArray(o)?o[1]:o;
window.askS=(i,v,raw)=>{if(!_askQ)return;_askQ.f[i].v=v;
  if(!raw){const w=document.getElementById('askw');
   const fd=document.getElementById('askfd'+i);
   fd.outerHTML=askF(_askQ.f[i],i).replace('class="askfd"','class="askfd" id="askfd'+i+'"')}};
window.askN=(i,d)=>{const f=_askQ.f[i];f.v=(parseFloat(f.v)||0)+d;
  if(f.min!==undefined&&f.v<f.min)f.v=f.min; if(f.max!==undefined&&f.v>f.max)f.v=f.max;
  f.v=Math.round(f.v*100)/100;
  document.querySelector('#askfd'+i+' input').value=f.v};
window.askX=r=>{if(!_askQ)return;const q=_askQ;_askQ=null;
  const w=document.getElementById('askw');w.classList.remove('on');document.body.style.overflow='';
  setTimeout(()=>{w.innerHTML=''},220);
  if(!r)return q.res(null);
  if(r===2)return q.res({__del:1});
  const o={};q.f.forEach(x=>{if(x.ty==='info')return;let v=x.v;
    if(x.ty==='num'||x.ty==='rate')v=parseFloat(v);
    if(typeof v==='string')v=v.trim();
    o[x.k]=v});
  q.res(o)};
/* shorthands */
const askOne=(t,k,ty,extra)=>ask({t,f:[{k:'v',ty,...(extra||{})}]}).then(r=>r?r.v:null);
const askYes=(t,s,ok)=>ask({t,s,ok:ok||L('بله','Yes'),f:[]}).then(r=>!!r);

/* کش: plan() در هر رندر چند بار صدا زده می‌شود و محاسبه‌اش سنگین است.
   کلید شامل هر چیزی است که خروجی را عوض می‌کند. */
let _planCache = null;
function planKey(){
  return [td(), new Date().getDay(),
    (S.mode && S.mode.d === td()) ? S.mode.k : '',
    S.ramadan ? S.ramadan.start : '',
    S.season, (S.ev || []).length, S.gymMode ? 1 : 0].join('~');
}
function planInvalidate(){ _planCache = null }

function plan(){
  const key = planKey();
  if (_planCache && _planCache.key === key) return _planCache.rows;
  const rows = planBuild();
  _planCache = { key, rows };
  return rows;
}

function planBuild(){
  const inf=dayInfo();
  /* حالت فصل بر اساس تقویم شمسی واقعی */
  S.season = inf.isSchoolPeriod ? 'school' : 'summer';
  const P0=PLANS[S.season];
  let d=new Date().getDay();
  let dayRows=(P0.byDay[d]||[]);
  /* بلوک‌های روز، بلوک‌های پایه را در بازهٔ متداخل کنار می‌زنند (اولویت با برنامهٔ روز) */
  let rows=[...P0.base.filter(b=>{
    const bs=tM(b[0]),be=tM(b[1]);
    if(be<bs) return true;                       // بلوک خواب (عبور از نیمه‌شب)
    if(b[5]==='food') {                           // وعده‌های غذایی فقط با تداخل کامل حذف شوند
      return !dayRows.some(r=>{const s=tM(r[0]),e=tM(r[1]);return e>bs&&s<be&&(s<=bs&&e>=be)});
    }
    return !dayRows.some(r=>{const s=tM(r[0]),e=tM(r[1]);return e>bs&&s<be});
  }),...dayRows];
  /* تعطیل رسمی: بلوک‌های مدرسه حذف و جایگزین می‌شوند */
  if(inf.official||inf.isFri){
    rows=rows.filter(r=>r[5]!=='duty');
    if(inf.official&&S.season==='school')
      rows.push(['08:00','10:30','◆','بلوک آزاد تعطیلات','مدرسه تعطیل است — درس عمیق یا مهارت','mind'],
                ['10:30','11:30','◇','فعالیت بدنی آزاد','پیاده‌روی، دوچرخه، یا تمرین انفرادی','body']);
  }
  /* دورهٔ امتحانات: تمرین سبک، درس بیشتر */
  if(inf.schoolType==='exam'){
    rows=rows.map(r=>r[5]==='body'&&r[3].includes('خانگی')?
      [r[0],r[1],'◇','تمرین سبک (دورهٔ امتحان)','۲۰ دقیقه — فقط برای حفظ ریتم','body']:r);
    rows.push(['20:15','21:00','▦','مرور امتحان فردا','بدون یادگیری جدید. فقط مرور.','mind']);
  }
  const ev=evToday();
  if(ev.length){
    // رویداد فعال: بلوک‌های متداخل حذف و بلوک رویداد جایگزین می‌شود
    const keep=['rest','food','look'];
    ev.forEach(e=>{
      const s=tM(e.st),en=s+e.dur*60;
      rows=rows.filter(r=>{
        const rs=tM(r[0]),re=tM(r[1]);
        if(keep.includes(r[5])&&!(rs<en&&re>s))return true;
        return !(rs<en&&re>s);
      });
      rows.push([e.st,hm(en),EVT[e.k].ic,EVT[e.k].t+(e.n?' — '+e.n:''),CLUB+' · '+EVT[e.k].rule,'body']);
    });
  }
  /* حالت رمضان: وعده‌ها حذف، سحری و افطار جایگزین، تمرین بعد از افطار */
  {const _r=(S.ramadan&&S.ramadan.start&&td()>=S.ramadan.start&&
     td()<=dstr(new Date(new Date(S.ramadan.start).getTime()+29*864e5)));
   if(_r){
    const st=sunTimes();
    const sahar=Math.max(0,st.rise-80), eftar=st.set;
    /* همهٔ وعده‌های روز و تمرین روز حذف می‌شوند */
    rows=rows.filter(r=>{
      if(r[5]==='food')return false;
      if(r[5]==='body'){const bs=tM(r[0]);return bs>=eftar}   /* تمرین فقط بعد افطار */
      return true;});
    const _h=m=>hm(m);
    /* سحری و افطار ثابت‌اند و اولویت دارند: هر بلوکی که با آن‌ها تداخل کند کنار می‌رود */
    const _win=[[Math.max(0,sahar-40),sahar],[eftar,eftar+35]];
    rows=rows.filter(r=>{const rs=tM(r[0]),re=tM(r[1]);
      if(re<=rs)return true;
      return !_win.some(([a,b])=>rs<b&&re>a);});
    rows.push([_h(Math.max(0,sahar-40)),_h(sahar),'◐','سحری',
      'پروتئین و آب فراوان. خرما، تخم‌مرغ، نان، ماست. آب کم‌کم تا اذان','food']);
    rows.push([_h(eftar),_h(eftar+35),'■','افطار',
      'با خرما و آب ولرم باز کن. تند نخور. ۲۰ دقیقه بعد غذای اصلی','food']);
    /* بقیه فقط اگر شکاف خالی باشد */
    const _fitR=(a,b)=>{const s0=tM(a),e0=tM(b);
      return !rows.some(r=>{const rs=tM(r[0]),re=tM(r[1]);return re>rs&&rs<e0&&re>s0});};
    const _addR=(a,b,ic,t,d,cat)=>{if(_fitR(a,b))rows.push([a,b,ic,t,d,cat])};
    _addR(_h(eftar+95),_h(eftar+125),'⚽','تمرین سبک بعد افطار',
      'بدن کم‌آب است. شدت را نصف کن و آب بنوش','body');
    _addR(_h(eftar+150),_h(eftar+180),'▲','وعدهٔ دوم',
      'پروتئین دوم روز تا به ۱۱۰ گرم برسی','food');
    _addR(_h(15*60),_h(15*60+40),'●','چرت جبرانی',
      'کوتاه و ثابت. جای خواب شب را پر می‌کند','rest');
   }}

  /* حالت‌های خرابی: فقط دسته‌های ضروری بماند */
  const _md=(S.mode&&S.mode.d===td()&&MODES[S.mode.k])?S.mode.k:'';
  if(_md&&MODES[_md]){
    const keep=MODES[_md].keep;
    rows=rows.filter(r=>keep.includes(r[5]));
    /* افزودن امن: فقط در شکافی که با هیچ بلوک باقی‌مانده تداخل ندارد */
    const _fit=(a,b)=>{const s0=tM(a),e0=tM(b);
      return !rows.some(r=>{const rs=tM(r[0]),re=tM(r[1]);
        return re>rs && rs<e0 && re>s0});};
    const _add=(a,b,ic,t,d,cat)=>{if(_fit(a,b))rows.push([a,b,ic,t,d,cat])};
    if(_md==='exam'){
      _add('16:00','17:30','▦','بلوک اضطراری درس','مرور فشرده — فقط مهم‌ترین فصل','mind');
      _add('18:10','19:30','▦','ادامهٔ مرور','تست بزن، فصل جدید شروع نکن','mind');
    }
    if(_md==='sick')
      _add('10:00','10:20','✚','آب و دارو','مایعات زیاد. بدن در حال ترمیم است','rest');
  }
  return rows
    .map(r=>({s:tM(r[0]),e:tM(r[1]),ic:r[2],t:r[3],d:r[4],c:r[5],id:r[2]+r[0]}))
    .sort((a,b)=>a.s-b.s);
}

  const diff=Math.floor((Date.now()-new Date(S.barber))/864e5);
  return Math.max(0,BARBER_WEEKS*7-diff);
}

/* ============================================================
   INTERACT — کاهش اصطکاک
   کشیدن انگشت، نگه داشتن، برگرداندن، ورودی سریع.
   همه با pointer events تا روی لمس و ماوس یکسان کار کند.
   ============================================================ */

/* ---------- برگرداندن ----------
   هر عمل برگشت‌پذیر یک عکس فوری از state می‌گیرد.
   پنج ثانیه فرصت، بعد پاک می‌شود. */
let _undo = null, _undoT = null;

window.undoPush = (label, snapshot) => {
  _undo = { label, snap: snapshot || JSON.stringify(S) };
  const el = document.getElementById('undo');
  if (!el) return;
  el.innerHTML = `<span>${label}</span><b onclick="undoRun()">${L('برگردان', 'Undo')}</b>`;
  el.classList.add('on');
  clearTimeout(_undoT);
  _undoT = setTimeout(() => el.classList.remove('on'), 5000);
};

window.undoRun = () => {
  if (!_undo) return;
  try {
    const prev = JSON.parse(_undo.snap);
    Object.keys(S).forEach(k => { delete S[k]; });
    Object.assign(S, prev);
    sv(); rd();
    tst('↩ ' + L('برگشت', 'Undone'));
  } catch (e) { tst(L('برگرداندن ممکن نشد', 'Undo failed')); }
  _undo = null;
  const el = document.getElementById('undo');
  if (el) el.classList.remove('on');
};

/* ---------- کشیدن روی ردیف ----------
   راست = انجام شد، چپ = رد کردن.
   آستانهٔ ۷۲ پیکسل تا با اسکرول عمودی تداخل نکند. */
const SWIPE_MIN = 72;

window.swipeRow = (html, onRight, onLeft, rightLabel, leftLabel) => {
  const id = 'sw' + Math.random().toString(36).slice(2, 8);
  return `<div class="sw" id="${id}"
    data-r="${onRight || ''}" data-l="${onLeft || ''}"
    onpointerdown="swStart(event,'${id}')">
    <div class="swi r">${rightLabel || '✓'}</div>
    <div class="swi l">${leftLabel || '↷'}</div>
    <div class="swc">${html}</div></div>`;
};

let _sw = null;

window.swStart = (e, id) => {
  const box = document.getElementById(id);
  if (!box) return;
  _sw = { id, x: e.clientX, y: e.clientY, box, moved: false, locked: null };
  box.setPointerCapture && box.setPointerCapture(e.pointerId);
};

window.swMove = e => {
  if (!_sw) return;
  const dx = e.clientX - _sw.x, dy = e.clientY - _sw.y;

  /* تا جهت مشخص نشده تصمیم نگیر — وگرنه اسکرول عمودی می‌شکند */
  if (!_sw.locked) {
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    _sw.locked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if (_sw.locked === 'x') _sw.box.classList.add('drag');
  }
  if (_sw.locked !== 'x') return;

  e.preventDefault();
  _sw.moved = true;
  const card = _sw.box.querySelector('.swc');
  const clamped = Math.max(-140, Math.min(140, dx));
  if (card) card.style.transform = `translateX(${clamped}px)`;
  _sw.box.classList.toggle('act', Math.abs(clamped) > 24);
};

window.swEnd = e => {
  if (!_sw) return;
  const box = _sw.box, card = box.querySelector('.swc');
  const dx = e.clientX - _sw.x;
  box.classList.remove('drag', 'act');
  if (card) card.style.transform = '';

  if (_sw.locked === 'x' && Math.abs(dx) >= SWIPE_MIN) {
    const fn = dx > 0 ? box.dataset.r : box.dataset.l;
    if (fn) {
      window.haptic(dx > 0 ? 14 : 8);
      try { new Function(fn)(); } catch (err) { }
    }
  }
  _sw = null;
};

/* ---------- نگه داشتن انگشت ---------- */
let _lpT = null;

window.lpStart = (e, fn) => {
  clearTimeout(_lpT);
  _lpT = setTimeout(() => {
    window.haptic(18);
    try { new Function(fn)(); } catch (err) { }
  }, 480);
};
window.lpEnd = () => clearTimeout(_lpT);

V.st=()=>{

  const _heat=(()=>{
    const DAYS=126, cell=[];
    const score=d=>{let n=0;
      if(S.done)Object.keys(S.done).forEach(k=>{if(k.startsWith(d+'|'))n++});
      if(S.q)Object.keys(S.q).forEach(k=>{if(k.startsWith(d+'|'))n++});
      if(Array.isArray(S.jr)&&S.jr.some(x=>x.d===d))n+=2;
      if(Array.isArray(S.wo)&&S.wo.some(x=>x.d===d))n+=2;
      return n};
    let max=1;
    for(let i=DAYS-1;i>=0;i--){
      const dt=dstr(new Date(Date.now()-i*864e5));
      const v=score(dt); if(v>max)max=v; cell.push([dt,v]);}
    const cols=Math.ceil(DAYS/7);
    let sq='';
    for(let c2=0;c2<cols;c2++)for(let r=0;r<7;r++){
      const idx=c2*7+r; if(idx>=cell.length)continue;
      const v=cell[idx][1], op=v===0?0.05:0.15+0.85*Math.min(1,v/max);
      sq+=`<rect x="${c2*7.6}" y="${r*7.6}" width="6.2" height="6.2" rx="1.6" fill="rgba(255,255,255,${op.toFixed(2)})"/>`;}
    const active=cell.filter(x=>x[1]>0).length;
    return `<div class="c gl"><div class="ct">▦ ${L('نقشهٔ فعالیت','Activity Map')}<b>${fa(active)}/${fa(DAYS)} ${L('روز','days')}</b></div>

     <svg width="100%" height="58" viewBox="0 0 ${cols*7.6} 53" preserveAspectRatio="xMidYMid meet" style="margin-top:8px">${sq}</svg>
     <div class="hint">${L('پیوستگی از شدت مهم‌تر است. خانه‌های خالی طبیعی‌اند؛ ردیف‌های خالی نه.','Consistency beats intensity.')}</div></div>`})();
  const _cb=S.comeback?`<div class="c gl" style="border-color:var(--br2)">
   <div class="ct">↩ ${L('پروتکل بازگشت','Comeback')}<b>${fa(S.comeback.n||0)}/۳</b></div>
   <div class="cs">${L('رکورد قبلی: '+fa(S.comeback.from||0)+' روز. سه روز پشت‌سرهم و دوباره در مسیری.','Previous: '+(S.comeback.from||0)+' days')}</div>
   <div class="bar" style="margin:9px 0"><div class="bf" style="width:${Math.min(100,(S.comeback.n||0)/3*100)}%"></div></div>
   <button class="bt p" onclick="cbTick()">${L('امروز انجام شد','Done today')}</button></div>`:'';
  const ks=Object.keys(S.stat),n=ks.length,cx=104,cy=100,R=72;
  const pt=(i,r)=>[cx+r*Math.cos(-Math.PI/2+i*2*Math.PI/n),cy+r*Math.sin(-Math.PI/2+i*2*Math.PI/n)];
  let g='';[.25,.5,.75,1].forEach(f=>g+=`<polygon points="${ks.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width=".7"/>`);
  const po=ks.map((k,i)=>pt(i,R*S.stat[k]/100).join(',')).join(' ');
  const lb=ks.map((k,i)=>{const[x,y]=pt(i,R+15);
   return `<text x="${x}" y="${y}" fill="#8a8a93" font-size="8.5" font-family="Vazirmatn" text-anchor="middle" dominant-baseline="middle">${STATS[k][0]}</text>`}).join('');
  const av=Math.round(ks.reduce((a,k)=>a+S.stat[k],0)/n);
  return _heat+_cb+`<div class="c gl" style="text-align:center"><div class="ct" style="justify-content:center">◇ ${L('نمای شخصیت','Character')}</div>
  <div class="cs">${L('میانگین','Avg')} ${fa(av)}٪ · LVL ${fa(lvl(S.xp))}</div>
  <svg width="208" height="200" viewBox="0 0 208 200">${g}
   ${ks.map((_,i)=>{const[x,y]=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,.08)" stroke-width=".7"/>`}).join('')}
   <polygon points="${po}" fill="rgba(255,255,255,.28)" stroke="#fff" stroke-width="1.4"/>
   ${ks.map((k,i)=>{const[x,y]=pt(i,R*S.stat[k]/100);return `<circle cx="${x}" cy="${y}" r="2.4" fill="#fff"/>`}).join('')}
   ${lb}</svg></div>

  <div class="c gl"><div class="ct">${L('ویژگی‌ها','Attributes')}</div>
  <div class="gr">${ks.map(k=>`<div class="st">
   <div class="sn"><span>${STATS[k][0]}</span><span class="sv">${fa(S.stat[k])}</span></div>
   <div class="bar"><div class="bf" style="width:${S.stat[k]}%"></div></div></div>`).join('')}</div></div>

  <div class="c gl"><div class="ct">◉ ${L('استریک','Streaks')}</div>
  <div class="gr">${[['clean',L('پاکی','Clean')],['train',L('تمرین','Train')],['sleep',L('خواب','Sleep')],['screen',L('کم‌مصرفی','Screen')]]

window.bkExport=()=>{

      setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},400);

window.bkImport=async()=>{
  const r=await ask({t:L('بازیابی از پشتیبان','Restore'),
    s:L('متن فایل پشتیبان را اینجا بچسبان. دادهٔ فعلی جایگزین می‌شود.','Paste backup JSON'),
    f:[{k:'j',ty:'area',v:''}],ok:L('بررسی','Check')});
  if(!r||!r.j||!String(r.j).trim())return;
  let o;
  try{o=JSON.parse(String(r.j).trim())}
  catch(e){tst(L('فایل معتبر نیست','Invalid JSON'));return}
  const d=o&&o.data?o.data:o;
  if(!d||typeof d!=='object'||Array.isArray(d)){tst(L('ساختار ناشناخته','Bad structure'));return}
  if(d.xp===undefined&&d.done===undefined&&d.jr===undefined){
    tst(L('این فایل پشتیبان Ascend نیست','Not an Ascend backup'));return}
  const ok=await ask({t:L('تأیید بازیابی','Confirm restore'),
    s:L('دادهٔ فعلی کاملاً جایگزین می‌شود. برگشت‌پذیر نیست.','Current data will be replaced.'),
    f:[{k:'i',ty:'info',rows:window.bkStats(o)}],ok:L('بازیابی کن','Restore')});
  if(!ok)return;
  try{
    localStorage.setItem(K+'.prev',JSON.stringify(S));   /* یک قدم برگشت */
    localStorage.setItem(K,JSON.stringify(d));
    tst(L('بازیابی شد. در حال بارگذاری…','Restored. Reloading…'));
    setTimeout(()=>location.reload(),700);
  }catch(e){tst(L('خطا در ذخیره','Save failed'))}
};

window.bkUndo=async()=>{
  let prev=null;
  try{prev=localStorage.getItem(K+'.prev')}catch(e){}
  if(!prev){tst(L('نسخهٔ قبلی موجود نیست','No previous version'));return}
  const ok=await ask({t:L('برگشت به قبل از بازیابی','Undo restore'),
    s:L('به وضعیت پیش از آخرین بازیابی برمی‌گردی.','Revert to pre-restore state.'),
    ok:L('برگرد','Revert')});
  if(!ok)return;
  try{
    localStorage.setItem(K,prev);
    localStorage.removeItem(K+'.prev');
    setTimeout(()=>location.reload(),500);
  }catch(e){tst(L('خطا','Failed'))}
};

window.brStart=()=>{
  let cyc=0,phase=0,left=BREATH[0][1];

  const draw=()=>{
    const [k,sec,label]=BREATH[phase];
    const pc=Math.round((1-left/sec)*100);
    box.innerHTML=`<div class="gdx"></div><div class="gds" style="max-height:auto">
     <div class="gdh"><div class="gdt">◍ ${L('تنفس ۴-۷-۸','Breathing')}</div>

      <div style="font-size:52px;font-weight:200;line-height:1">${fa(left)}</div>

      <div class="bar" style="margin:18px 0"><div class="bf" style="width:${pc}%"></div></div>
      <div class="hint">${L('چرخهٔ ','Cycle ')}${fa(cyc+1)} ${L('از ۴','of 4')}</div>
      <div class="hint">${L('این تمرین ضربان قلب را پایین می‌آورد. قبل امتحان و مسابقه.','Lowers heart rate.')}</div>
     </div></div>`;
    box.classList.add('op');};
  draw();
  if(window.__br)clearInterval(window.__br);
  window.__br=setInterval(()=>{
    left--;
    if(left<=0){phase++;
      if(phase>=BREATH.length){phase=0;cyc++;
        if(cyc>=4){window.brStop();xp(20);tst('◍ '+L('تمام شد','Done'));return}}
      left=BREATH[phase][1];}

function soOrbit(){
  const cx=124,cy=124,P=S.ppl||[];
  let g=`<defs><radialGradient id="soc" cx="50%" cy="50%"><stop offset="0%" stop-color="#fff" stop-opacity=".22"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>`;
  g+=`<circle cx="${cx}" cy="${cy}" r="112" fill="url(#soc)"/>`;
  RINGS.slice().reverse().forEach(r=>{
    const n=P.filter(p=>p.r===r.k).length, cap=RING_CAP[r.k];
    const full=cap<900&&n>cap;
    g+=`<circle cx="${cx}" cy="${cy}" r="${r.r}" fill="none"
      stroke="rgba(255,255,255,${full?.34:.14})" stroke-width="${full?1.1:.7}"
      ${full?'':'stroke-dasharray="1.5 3.5"'}/>`;
    g+=`<text x="${cx}" y="${cy-r.r+9}" fill="#5c5c66" font-size="6" font-family="Vazirmatn" text-anchor="middle">${r.t}</text>`;
  });
  /* چیدمان در هر حلقه: توزیع یکنواخت */
  RINGS.forEach(R=>{
    const grp=P.filter(p=>p.r===R.k);
    grp.forEach((p,i)=>{
      const rr=R.r-14, an=((i/Math.max(1,grp.length))*360-90)*Math.PI/180;
      const x=cx+rr*Math.cos(an), y=cy+rr*Math.sin(an);
      const w=warmth(S,p), od=overdue(S,p).due;
      const rad=4.5+w/100*3.5;
      const op=.25+w/100*.75;
      const idx=P.indexOf(p);
      g+=`<g style="cursor:pointer" onclick="soPerson(${idx})">`;
      if(w>55)g+=`<circle cx="${x}" cy="${y}" r="${rad+4}" fill="#fff" opacity="${(w-55)/45*.16}"/>`;
      g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#fff" stroke-opacity="${.05+w/100*.22}" stroke-width="${.4+w/100*1}"/>`;
      g+=`<circle cx="${x}" cy="${y}" r="${rad}" fill="${p.e<0?'none':'#fff'}" fill-opacity="${p.e<0?0:op}"
        stroke="#fff" stroke-opacity="${p.e<0?.5:.85}" stroke-width="${p.e<0?1.1:.5}"/>`;
      if(od)g+=`<circle cx="${x+rad+2.5}" cy="${y-rad-1}" r="2" fill="#fff"/>`;
      g+=`<text x="${x}" y="${y+rad+7.5}" fill="#8a8a93" font-size="6.2" font-family="Vazirmatn" text-anchor="middle">${p.n.slice(0,8)}</text></g>`;
    });
  });
  g+=`<circle cx="${cx}" cy="${cy}" r="14" fill="#fff"/>
   <text x="${cx}" y="${cy}" fill="#000" font-size="8.5" font-family="Vazirmatn" font-weight="800" text-anchor="middle" dominant-baseline="central">${L('تو','You')}</text>`;
  return `<svg width="100%" viewBox="0 0 248 248" style="max-width:300px">${g}</svg>`;
}
